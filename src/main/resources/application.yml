spring:
  application.name: wallet-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USERNAME:wallet}
    password: ${DB_PASSWORD:wallet}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway.enabled: true
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
  metrics.distribution.percentiles-histogram.http.server.requests: true
  metrics.distribution.percentiles.http.server.requests: 0.5,0.95,0.99
server.port: ${PORT:8080}
