services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports: [ "5432:5432" ]
    volumes: [ "postgres-data:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U wallet -d wallet" ]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/wallet
      DB_USERNAME: wallet
      DB_PASSWORD: wallet
      SPRING_PROFILES_ACTIVE: local
    ports: [ "8080:8080" ]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL","wget -qO- http://localhost:8080/actuator/health/readiness" ]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
